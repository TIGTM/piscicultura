<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trocar senha · IEFISH VIEW</title>
    <link rel="stylesheet" href="/change-password.css">
</head>
<body>
    <main class="login-shell">
        <section class="login-panel" aria-labelledby="change-title">
            <header class="login-brand">
                <span class="login-brand-icon" aria-hidden="true">🐟</span>
                <div>
                    <strong>IEFISH VIEW</strong>
                    <span>Fechamento da piscicultura</span>
                </div>
            </header>
            <div class="login-heading">
                <h1 id="change-title">Crie sua nova senha</h1>
                <p>Por segurança, troque a senha inicial antes de continuar.</p>
            </div>
            <form id="change-password-form" novalidate>
                <div class="login-field">
                    <label for="new-password">Nova senha</label>
                    <input id="new-password" type="password" autocomplete="new-password" minlength="6" required autofocus>
                </div>
                <div class="login-field">
                    <label for="confirm-password">Confirme a nova senha</label>
                    <input id="confirm-password" type="password" autocomplete="new-password" minlength="6" required>
                </div>
                <label class="password-visibility">
                    <input id="show-password" type="checkbox">
                    <span>Mostrar senha</span>
                </label>
                <div id="change-error" class="login-error" role="alert" hidden></div>
                <button id="change-button" type="submit">Salvar nova senha</button>
            </form>
        </section>
    </main>
    <script src="/change-password.js"></script>
</body>
</html>
