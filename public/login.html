<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar · IEFISH VIEW</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/login.css">
</head>
<body>
    <main class="login-shell">
        <section class="login-panel" aria-labelledby="login-title">
            <header class="login-brand">
                <span class="login-brand-icon" aria-hidden="true">🐟</span>
                <div>
                    <strong>IEFISH VIEW</strong>
                    <span>Fechamento da piscicultura</span>
                </div>
            </header>

            <div class="login-heading">
                <h1 id="login-title">Acesso ao sistema</h1>
                <p>Entre com suas credenciais para consultar os dados do IEFish.</p>
            </div>

            <form id="login-form" novalidate>
                <div class="login-field">
                    <label for="username">Usuário</label>
                    <input
                        id="username"
                        name="username"
                        type="text"
                        value=""
                        autocomplete="username"
                        required
                        autofocus
                    >
                </div>

                <div class="login-field">
                    <label for="password">Senha</label>
                    <input
                        id="password"
                        name="password"
                        type="password"
                        value=""
                        autocomplete="current-password"
                        required
                    >
                </div>

                <label class="password-visibility">
                    <input id="show-password" type="checkbox">
                    <span>Mostrar senha</span>
                </label>

                <div id="login-error" class="login-error" role="alert" hidden></div>

                <button id="login-button" type="submit">Entrar</button>
            </form>

            <p class="initial-access">No primeiro acesso, será solicitada a troca da senha.</p>
        </section>
    </main>

    <script src="/login.js"></script>
</body>
</html>
